# Karrd Kings deal alert settings. Edit this file on GitHub to change anything.

players:
  - Michael Jordan
  - Shohei Ohtani
  - Victor Wembanyama
  - Kobe Bryant

# Alert when (price + shipping) is at least this far under recent sold comps.
# 0.35 = 35% under market.
discount_threshold: 0.35

# Only look at Buy It Now listings in this price range (USD, before shipping).
min_price: 50
max_price: 500

# Need at least this many recent sold comps before trusting the market value.
min_comps: 5

# How far back to look for sold comps ("30d", "3m", "6m", "1y").
comp_period: 3m

# eBay final value fee + payment processing, used for the profit estimate.
fee_rate: 0.13

# CardSight API calls allowed per month. Free plan = 750, Pro = 5000.
# Keep this a little under your plan's limit.
monthly_budget: 700

# Listings older than this (hours) are dropped from the queue; good deals sell fast.
max_listing_age_hours: 6

# Titles containing any of these words are skipped.
exclude_words:
  - lot
  - lots
  - you pick
  - pick your
  - choose
  - reprint
  - rp
  - custom
  - replica
  - facsimile
  - fan made
  - novelty
  - digital
  - break
  - repack
  - mystery
  - box
  - pack
  - case
  - read description
  - damaged
  - proxy

# Free eBay pre-check: only spend a CardSight check on listings priced at or below
# this fraction of the cheaper-end asks for the same card (0.8 = 20% below them).
precheck_max_ratio: 0.8
prechecks_per_run: 40

# High-speed trial: until this time, price this many listings every run (still never
# goes over monthly_budget). After it ends, the rest of the month's budget is spread evenly.
burst_until: "2026-09-27T02:00:00+00:00"   # Sat 10pm ET (today's trial)
burst_checks_per_run: 10

# Auctions: also check auctions ending within this many minutes that have few bids.
# Alerts tell you the most you can bid and still be discount_threshold under market.
auctions: true
auction_window_minutes: 30
auction_max_bids: 5
