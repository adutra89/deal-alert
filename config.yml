# Karrd Kings deal alert settings. Edit this file on GitHub to change anything.

players:
  - Michael Jordan
  - Shohei Ohtani
  - Victor Wembanyama
  - Kobe Bryant
  - LeBron James
  - Stephen Curry
  - Tom Brady
  - Ken Griffey Jr
  - Bobby Witt Jr

# Per-player filters so a dad's cards don't show up in the son's search.
player_rules:
  Ken Griffey Jr:
    exclude: [sr, "sr.", senior]
    min_year: 1987      # Jr's first cards; Sr's are mostly 1970s-80s
  Bobby Witt Jr:
    exclude: [sr, "sr.", senior]
    min_year: 2019      # Jr's first cards; Sr pitched 1986-2001

# How alerts are decided:
#   asks  = alert when a listing is ask_discount below what other eBay sellers ask for the same card (free, no CardSight)
#   comps = alert when below CardSight sold comps (uses CardSight calls)
mode: asks
ask_discount: 0.25
max_alerts_per_run: 3
# Before alerting, check real sold prices (CardSight). Alert only when BOTH agree it's cheap:
# 40%+ under other sellers' asks AND price + shipping at most this fraction of the sold median (0.85 = 15%+ under).
verify_with_cardsight: true
# Weekend show push: allow more sold-price checks per day until this time (then back to the even monthly pace).
boost_until: "2026-10-05T04:00:00+00:00"   # through Sun 11:59pm ET
boost_daily_checks: 130
require_sold_confirmation: true
veto_if_over_sold: 0.88

# (comps mode only) Alert when (price + shipping) is at least this far under recent sold comps.
# 0.30 = 30% under market.
discount_threshold: 0.30

# Only look at Buy It Now listings in this price range (USD, before shipping).
min_price: 50
max_price: 1000

# Need at least this many recent sold comps before trusting the market value.
min_comps: 4

# How far back to look for sold comps ("30d", "3m", "6m", "1y").
comp_period: 3m

# eBay final value fee + payment processing, used for the profit estimate.
fee_rate: 0.13

# CardSight API calls allowed per month. Free plan = 750, Pro = 5000.
# Keep this a little under your plan's limit.
monthly_budget: 748

# Listings older than this (hours) are dropped from the queue; good deals sell fast.
max_listing_age_hours: 6

# Titles containing any of these words are skipped.
exclude_words:
  - lot
  - lots
  - you pick
  - pick your
  - choose
  - reprint
  - rp
  - custom
  - replica
  - facsimile
  - fan made
  - novelty
  - digital
  - break
  - repack
  - mystery
  - box
  - pack
  - case
  - read description
  - damaged
  - proxy

# Free eBay pre-check: only spend a CardSight check on listings priced at or below
# this fraction of the cheaper-end asks for the same card (0.7 = 30% below them).
precheck_max_ratio: 0.7
prechecks_per_run: 35
precheck_priority: price
auction_prechecks_per_run: 20
# Reuse other sellers' asking prices for this many hours, and sold comps for this many days.
ask_cache_hours: 6
comp_cache_days: 7

# High-speed trial: until this time, price this many listings every run (still never
# goes over monthly_budget). After it ends, the rest of the month's budget is spread evenly.
burst_until: "2026-10-05T03:59:00+00:00"   # trial week: through Sun 11:59pm ET
burst_checks_per_run: 1

# Auctions: also check auctions ending within this many minutes that have few bids.
# Alerts tell you the most you can bid and still be discount_threshold under market.
auctions: true
auction_window_minutes: 30
auction_max_bids: 5
