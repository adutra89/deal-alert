name: Deal alert

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes (GitHub may run a few minutes late)
  push:
    paths: ["run_test.txt"]   # editing this file runs a full test that always sends one TEST alert
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test push notification to your phone"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: deal-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan eBay for deals
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          CARDSIGHT_API_KEY: ${{ secrets.CARDSIGHT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
          SAMPLE_ALERT: ${{ github.event_name == 'push' }}
        run: python deal_alert.py
      - name: Save progress
        if: always()
        run: |
          git config user.name "deal-alert-bot"
          git config user.email "deal-alert-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state [skip ci]" -q && git pull --rebase -q && git push -q)
