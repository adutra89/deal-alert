name: Deal alert

# How this stays running: each run loops, scanning every 20 minutes for ~5.5 hours,
# then starts the next run itself. GitHub's own timer below is only a backup in case
# the chain ever stops (GitHub's timer alone is unreliable).
on:
  schedule:
    - cron: "7 */2 * * *"   # backup restart every 2 hours
  push:
    paths: ["run_test.txt", "start.txt"]   # run_test.txt = one-off TEST alert; start.txt = (re)start the loop
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test push notification to your phone"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: deal-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan eBay for deals every 20 minutes
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          CARDSIGHT_API_KEY: ${{ secrets.CARDSIGHT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SINGLE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[test]') }}
          FIRST_TEST: ${{ inputs.test_notification }}
        run: |
          git config user.name "deal-alert-bot"
          git config user.email "deal-alert-bot@users.noreply.github.com"
          start=$(date +%s)
          first=true
          while true; do
            git pull -q --rebase origin main || true
            if [ "$first" = true ]; then export TEST_NOTIFICATION="$FIRST_TEST"; else export TEST_NOTIFICATION=false; fi
            if [ "$SINGLE" = true ]; then export SAMPLE_ALERT=true; fi
            python deal_alert.py || echo "run failed, will retry next cycle"
            git add state.json
            git diff --cached --quiet || (git commit -m "update state [skip ci]" -q && (git push -q || (git pull -q --rebase origin main && git push -q)))
            first=false
            [ "$SINGLE" = true ] && break
            [ $(( $(date +%s) - start )) -gt 19200 ] && break   # ~5h20m, leaves room for the last cycle
            sleep 1200
          done
      - name: Start the next run
        if: ${{ !cancelled() && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[test]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deal-alert.yml --ref main -f test_notification=false
